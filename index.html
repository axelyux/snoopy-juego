<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Snoopy Platformer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    canvas {
      touch-action: none;
    }

    /*
      El juego es horizontal (800x600). En vertical el lienzo queda como una franja diminuta
      con enormes bandas negras y es injugable, asi que en esa orientacion se tapa todo con un
      aviso para girar el telefono. Solo aplica a pantallas de movil: en un monitor vertical
      grande el juego se ve bien igual.
    */
    #rotate-overlay {
      display: none;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #game-container {
        display: none;
      }

      #rotate-overlay {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      #rotate-overlay .phone {
        width: 64px;
        height: 104px;
        border: 5px solid #ffffff;
        border-radius: 12px;
        margin-bottom: 26px;
        animation: tilt 1.6s ease-in-out infinite;
      }

      #rotate-overlay h1 {
        font-size: 21px;
        margin: 0 0 10px;
      }

      #rotate-overlay p {
        font-size: 14px;
        margin: 0;
        color: #b9c4d4;
      }
    }

    @keyframes tilt {
      0%, 100% { transform: rotate(0deg); }
      55%, 95% { transform: rotate(-90deg); }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="phone"></div>
    <h1>Gira tu teléfono</h1>
    <p>Snoopy se juega en horizontal</p>
  </div>

  <div id="game-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <script src="src/utils/SpriteUtils.js"></script>
  <script src="src/utils/TouchControls.js"></script>
  <script src="src/entities/Projectile.js"></script>
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/Enemy.js"></script>
  <script src="src/entities/Boss.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/WorldMapScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/PauseScene.js"></script>
  <script src="src/scenes/VictoryScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
